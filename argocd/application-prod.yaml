apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: awstoazure-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/abhaygha/awstoazure
    targetRevision: main
    path: helm/awstoazure
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: awstoazure-prod
  syncPolicy:
    automated:
      prune: false  # More conservative for production
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
