# Development Environment Values
replicaCount: 1

image:
  tag: latest
  pullPolicy: Always

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: awstoazure-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "development"
  - name: JAVA_OPTS
    value: "-Xmx384m -Xms256m"

monitoring:
  enabled: false
