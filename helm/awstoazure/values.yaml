# Default values for awstoazure
# This is a YAML-formatted file.

# Application Configuration
app:
  name: awstoazure
  version: "1.0.0"

# Replica Configuration
replicaCount: 2

# Image Configuration
image:
  repository: 891377120087.dkr.ecr.us-east-1.amazonaws.com/aws2azurepo
  tag: latest
  pullPolicy: Always

# Image Pull Secrets (for private registries)
imagePullSecrets:
  - name: ecr-registry-secret

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod Security Context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: awstoazure.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: awstoazure-tls
      hosts:
        - awstoazure.example.com

# Resource Limits and Requests
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

# Health Checks
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Auto Scaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Node Selection
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Environment Variables
env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"
  - name: JAVA_OPTS
    value: "-Xmx768m -Xms512m"
  - name: SERVER_PORT
    value: "8080"

# Config Maps
configMap:
  enabled: true
  data:
    application.properties: |
      server.port=8080
      spring.application.name=awstoazure
      management.endpoints.web.exposure.include=health,info,prometheus
      management.endpoint.health.probes.enabled=true
      management.health.livenessstate.enabled=true
      management.health.readinessstate.enabled=true

# Secrets (for sensitive data)
secrets:
  enabled: false
  data: {}

# Persistent Volume Claims
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""

# Network Policies
networkPolicy:
  enabled: false

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: 1

# Monitoring and Observability
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /actuator/prometheus
