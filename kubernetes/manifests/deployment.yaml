apiVersion: apps/v1
kind: Deployment
metadata:
  name: awstoazure-app
  namespace: awstoazure-prod
  labels:
    app: awstoazure
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: awstoazure
  template:
    metadata:
      labels:
        app: awstoazure
        version: v1
    spec:
      serviceAccountName: awstoazure-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: awstoazure
        image: 891377120087.dkr.ecr.us-east-1.amazonaws.com/aws2azurepo:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-Xmx1024m -Xms512m"
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: config-volume
        configMap:
          name: awstoazure-config
      imagePullSecrets:
      - name: ecr-registry-secret
