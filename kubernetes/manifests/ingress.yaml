apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: awstoazure-ingress
  namespace: awstoazure-prod
  labels:
    app: awstoazure
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - awstoazure.yourdomain.com
    secretName: awstoazure-tls
  rules:
  - host: awstoazure.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: awstoazure-service
            port:
              number: 80
